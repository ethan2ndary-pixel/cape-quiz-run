<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cape Mountains Runner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Start Screen -->
  <div id="start-screen" class="visible">
    <h1>Cape Mountains Runner</h1>
    <p>Jump, collect orbs, and answer quiz questions to learn about the Cape Mountains!</p>
    <button id="start-button">Start Game</button>
    <h3>High Scores</h3>
    <ul id="score-list"></ul>
  </div>

  <!-- Quiz Popup -->
  <div id="quiz-popup" class="hidden">
    <div id="quiz-question"></div>
    <div id="quiz-options"></div>
  </div>

  <!-- Game Over Screen -->
  <div id="game-over" class="hidden fade">
    <h2>Game Over!</h2>
    <p id="final-score"></p>
    <input id="player-name" placeholder="Enter your name" />
    <button id="save-score">Save Score</button>
    <button id="restart">Restart</button>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas" class="hidden"></canvas>

  <script src="script.js"></script>
</body>
</html>
