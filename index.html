<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cape Mountains Runner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="start-screen" class="visible fade">
    <h1>Cape Mountains Runner</h1>
    <p>Jump, collect orbs, and answer quiz questions about the Cape Mountains!</p>
    <button id="start-button">Start Game</button>
    <h3>High Scores</h3>
    <ul id="score-list"></ul>
  </div>

  <canvas id="gameCanvas" class="hidden"></canvas>

  <div id="quiz-popup" class="hidden">
    <h2 id="quiz-question"></h2>
    <div id="quiz-options"></div>
  </div>

  <div id="game-over" class="hidden">
    <h2 id="final-score"></h2>
    <input type="text" id="player-name" placeholder="Enter your name" />
    <button id="save-score">Save Score</button>
    <button id="restart">Restart</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
